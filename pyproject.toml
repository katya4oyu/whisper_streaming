[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whisper-streaming"
version = "0.1.0"
description = "Whisper realtime streaming for long speech-to-text transcription and translation"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "Dominik Macháček", email = "machacek@ufal.mff.cuni.cz"},
]
maintainers = [
    {name = "Dominik Macháček", email = "machacek@ufal.mff.cuni.cz"},
]
keywords = ["whisper", "streaming", "real-time", "transcription", "translation", "speech-to-text", "asr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "numpy",
    "librosa",
    "soundfile",
]

[project.optional-dependencies]
faster-whisper = ["faster-whisper"]
whisper-timestamped = ["whisper-timestamped"]
openai-api = ["openai>=1.0.0"]
mlx = ["mlx-whisper"]
vad = ["torch", "torchaudio"]
tokenizers = [
    "opus-fast-mosestokenizer",
    "tokenize-uk",
    "wtpsplit",
]
all = [
    "faster-whisper",
    "whisper-timestamped",
    "openai>=1.0.0",
    "mlx-whisper",
    "torch",
    "torchaudio",
    "opus-fast-mosestokenizer",
    "tokenize-uk",
    "wtpsplit",
]

[project.scripts]
whisper-streaming = "whisper_online:main"
whisper-streaming-server = "whisper_online_server:main"

[project.urls]
Homepage = "https://github.com/ufal/whisper_streaming"
Documentation = "https://github.com/ufal/whisper_streaming"
Repository = "https://github.com/ufal/whisper_streaming.git"
Issues = "https://github.com/ufal/whisper_streaming/issues"

[tool.hatch.build.targets.wheel]
packages = ["."]